<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007FFF">
  <title>Music Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="layout">

<main class="player">

  <header class="now-playing">
    <p class="eyebrow">Now Playing</p>
    <h1 class="song-title" id="songTitle">Paste a link to start</h1>
    <p class="artist" id="songArtist">&nbsp;</p>
  </header>

  <!-- Paste a YouTube link -->
  <section class="youtube-input" aria-label="Play from a YouTube link">
    <h2 class="section-label">YouTube link</h2>
    <form id="youtubeForm" class="youtube-form">
      <input
        type="url"
        id="youtubeUrl"
        class="youtube-field"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
        inputmode="url"
        required
      >
      <button type="submit" class="youtube-submit">Play</button>
    </form>
    <p class="youtube-hint" id="youtubeHint"></p>
  </section>

  <!-- Compact "audio style" now-playing bar. YouTube is what actually
       produces the sound, so a player still has to exist in the DOM,
       but it's shrunk down to an invisible mount point — nothing
       video-shaped is shown, only the custom controls below. -->
  <section class="player-bar" id="playerBar" hidden>
    <div class="yt-audio-mount">
      <div id="youtubePlayer"></div>
    </div>
    <div class="player-controls">
      <button type="button" class="play-pause" id="playPauseBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" width="18" height="18" hidden><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <div class="progress-track" id="progressTrack">
        <div class="progress-bg"></div>
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time-label" id="timeLabel">0:00 / 0:00</span>
      <button type="button" class="volume-btn" id="volumeBtn" aria-label="Mute">
        <svg id="volumeIconSvg" viewBox="0 0 24 24" width="18" height="18">
          <path id="volumePath" fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/>
        </svg>
      </button>
      <input
        type="range"
        class="volume-slider"
        id="volumeSlider"
        min="0"
        max="100"
        value="100"
        aria-label="Volume"
      >
    </div>
  </section>

  <section class="lyrics-panel">
    <div class="lyrics-panel-header">
      <h2>Lyrics</h2>
      <div class="sync-adjust" id="syncAdjust" aria-label="Adjust lyric sync">
        <button type="button" class="sync-btn" id="syncEarlier" aria-label="Shift lyrics earlier">−</button>
        <span class="sync-offset" id="syncOffset">0.0s</span>
        <button type="button" class="sync-btn" id="syncLater" aria-label="Shift lyrics later">+</button>
      </div>
    </div>
    <div class="lyrics-viewport" id="lyricsViewport" aria-live="polite">
      <div class="lyrics-track" id="lyricsTrack"></div>
    </div>
  </section>

</main>

<!-- Song suggestions — sits to the right of the player on wide
     screens and drops below it once space runs out (tablets/phones),
     purely via flex-wrap, no separate mobile layout needed. -->
<aside class="suggestions" aria-label="Song suggestions">
  <h2 class="section-label">Suggested for you</h2>
  <div class="artist-picker" id="artistPicker" role="tablist" aria-label="Choose an artist"></div>
  <ul class="suggestion-list" id="suggestionList"></ul>
</aside>

</div>

<footer class="credit">
  Built by <span class="credit-name">Kled</span>
</footer>

<script src="https://www.youtube.com/iframe_api" defer></script>
<script src="script.js"></script>

</body>
</html>
